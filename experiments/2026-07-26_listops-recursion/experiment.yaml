# Filled in. run.py reads it. No magic constants in code.
id: "2026-07-26_listops-recursion"
title: "Latent recursion on nested expressions: does a looped tied block scale its recursion with PARSE DEPTH? (ListOps-mini, train depth 1-4, test 5-6, length-matched)"
hypothesis: "The stochastic-depth recipe that produced real test-time-compute extrapolation on a SERIAL task (registry 2026-07-25_loop-test-time-compute, 2026-07-26_looped-halt-nrasp) also extends to a HIERARCHICAL one: a weight-tied looped block trained on nesting depth 1-4 with k~U{1..4} should keep improving on unseen depth 5-6 expressions when given more loops at test time, with loop iteration t resolving nesting level t."
seed: 0
dataset:
  name: "ListOps-mini (synthetic, generated in-repo by listops.py)"
  source: "generated; task family from ListOps, Nangia & Bowman NAACL-SRW 2018 (https://aclanthology.org/N18-4013/)"
  license: "synthetic data generated by this repo; ListOps task design is from the cited paper"
# --- hyperparameters ---
params:
  # ---- task ----
  ops: ["MAX", "MIN", "MED"]          # SUM_MOD dropped, per the backlog item
  train_depths: [1, 2, 3, 4]
  eval_depths: [1, 2, 3, 4, 5, 6]
  len_lo: 25                          # token-length band, SHARED by every depth so that
  len_hi: 34                          # depth extrapolation is not length extrapolation
  max_len: 36                         # 34 expression tokens + CLS, padded
  n_train: 40000
  n_eval: 384
  # ---- model (weight-tied looped block, bidirectional attention) ----
  d_model: 96
  n_heads: 4
  d_ff: 384
  # ---- loops ----
  k_train: 4
  k_eval_max: 8
  arms: ["fixed_k4", "stoch_k1to4", "deepsup_k4"]
  seeds: [0, 1]
  # ---- optimisation ----
  steps: 700
  batch: 64
  lr: 0.003
  wd: 0.01
  warmup: 90
  # ---- probe ----
  run_probe: true
  probe_arm: "stoch_k1to4"

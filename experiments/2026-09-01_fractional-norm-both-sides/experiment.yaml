  hash: "md5:6fb458f1232090904fb40fe944165e91"
params:
  head_dims: [4, 8, 16, 32, 64, 128]
  arms:
    fqn:  [true,  false, "undetached", null]
    fqkn: [true,  true,  "undetached", "undetached"]
  arm_order: ["fqn", "fqkn"]
  seeds: [0, 1, 2]

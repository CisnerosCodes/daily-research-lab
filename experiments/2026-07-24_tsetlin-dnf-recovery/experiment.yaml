# Fill this in. run.py reads it. No magic constants in code.
id: "2026-07-24_tsetlin-dnf-recovery"
title: "Tsetlin Machine: does exact rule recovery break before accuracy under label noise?"
hypothesis: "As label noise rises, a Tsetlin Machine's test accuracy degrades gracefully but its exact recovery of the planted DNF clauses collapses earlier - interpretability breaks before accuracy does."
seed: 0
dataset:
  name: "planted 3-clause DNF over 10 boolean variables"
  source: "generated"
  license: "n/a"
# --- hyperparameters ---
params:
  n_vars: 10                # boolean input variables (x9 is an irrelevant distractor)
  planted_dnf:              # each clause: list of [var_index, sign] with sign 1 = x, 0 = NOT x
    - [[0, 1], [1, 1], [2, 0]]
    - [[3, 0], [4, 1], [5, 1]]
    - [[6, 1], [7, 0], [8, 0]]
  n_train: 3000
  n_test: 2000
  noise_levels: [0.0, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4]
  seeds: [0, 1, 2]
  # Tsetlin Machine
  n_clauses: 20             # 10 positive-polarity + 10 negative-polarity
  T: 10                     # vote clip threshold
  s: 3.0                    # specificity (3.0 recovers the planted DNF exactly on clean data; 5.0 over-includes literals)
  n_states: 100             # automaton states per action side
  epochs: 60

# Config for 2026-09-01_kscale-adaptive-vs-static. run.py reads it. No magic constants in code.
id: "2026-09-01_kscale-adaptive-vs-static"
title: "Is the running-scale key win adaptive normalization or a better key scale? Static first-batch scale vs EMA at three momenta vs the query side, at the cliff and the wide split"
hypothesis: >-
  In the 2026-09-01 head sweep, dividing keys by a per-head EMA of their RMS with NO per-token
  normalization (k_emascale, alpha frozen at 1) reproduced FKN's 0.07 bpc win over the unnormalised
  baseline at hd=4, while 08-31 showed a learnable per-channel key gain is free (+0.002). Two accounts
  remain: (A) the win is an init-scale effect (keys start ~4x too small for sharp attention at hd=4,
  and any constant per-head rescale of that size would do), or (B) the win is ADAPTIVE (the running
  scale tracks the key statistics through training, an automatic temperature controller). Arms:
  k_static_init_scale freezes the per-head scale at its first-batch value (A's prediction: matches
  k_emascale); k_emascale at momentum 0.9 / 0.99 / 0.999 varies adaptation speed (B predicts a
  dependence, A predicts none); q_emascale applies the identical trick to queries (side-symmetry).
  Predictions registered: P1 static-init recovers less than half of k_emascale's win at hd=4;
  P2 the momentum sweep is monotone (faster tracking helps); P3 the query side gives at most half
  the key-side win.

# Fill this in. run.py reads it. No magic constants in code.
id: "2026-07-25_coconut-toy-graph"
title: "nano-Coconut on DAG reachability: continuous thoughts vs discrete CoT vs pause vs no-CoT, and can a linear probe read the BFS frontier?"
hypothesis: "At ~0.1M params on yes/no DAG reachability, Coconut-style continuous thoughts (H=3 latent steps before the answer) beat discrete chain-of-thought and no-CoT at matched parameters and matched training steps, and a per-node logistic probe on the thought vectors decodes the BFS frontier at hop h well above a shuffled-label control."
seed: 0
dataset:
  name: "synthetic random DAGs, N=8 nodes, out-degree <= 2, exactly E=10 edges, fixed-width adjacency-slot encoding; yes/no reachability-within-3-hops queries balanced 50/50 and stratified by shortest-path length 1/2/3"
  source: "generated in run.py (numpy PCG64, fixed seeds; train/test/probe pools drawn from disjoint seeded streams)"
  license: "n/a (synthetic)"
# --- hyperparameters (add whatever the experiment needs) ---
params:
  # --- task ---
  n_nodes: 8
  n_edges: 10
  max_out_degree: 2        # fixes the adjacency-slot width; prefix length is constant
  max_hops: 3              # positive queries have shortest path length 1..3
  n_thoughts: 3            # H latent / CoT / pause slots before the answer
  n_train: 20000           # training pool of graphs (batches sampled from it)
  n_test: 3000             # held-out eval graphs (disjoint generator stream)
  n_probe_train: 1200
  n_probe_test: 1000
  # --- model ---
  n_layers: 2
  d_model: 64
  n_heads: 4
  d_ff: 256
  # --- optimisation ---
  steps: 1100
  warmup: 50
  batch_size: 64
  lr: 0.002
  weight_decay: 0.01
  grad_clip: 1.0
  seeds: [0, 1]
  arms: ["nocot", "pause", "cot", "coconut", "coconut_nocur"]
  curriculum_frac: 0.6      # coconut: k=0,1,2 stages fill the first 60% of steps, then k=3
  time_cap_s_per_run: 130   # honest time-box safety net: training stops early if hit
  # --- probe ---
  probe_steps: 120
  probe_lr: 0.15
  probe_wd: 0.001
  probe_arms: ["coconut", "coconut_nocur", "cot", "pause", "nocot"]

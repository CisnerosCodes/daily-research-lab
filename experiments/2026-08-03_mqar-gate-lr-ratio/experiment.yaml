# Fill this in. run.py reads it. No magic constants in code.
id: "2026-08-03_mqar-gate-lr-ratio"
title: "MQAR gate LR ratio: does boosting only the gate's learning rate pull breakout earlier?"
hypothesis: "On the mqar-gate-freeze-before-breakout harness (d=64, N=8, 2000 steps), if withheld gate learning delays breakout (2026-08-01: freeze-timing monotone on paired inits), then ADDING gate learning should advance it: multiplying ONLY the gate's learning rate by {0.25, 1, 4, 16} should shift the escape step monotonically earlier as the multiplier grows, with the gate's weight-norm travel at escape roughly constant across multipliers (travel-as-clock); a x16 gate may destabilize by outrunning the qkv circuit."
seed: 0
dataset:
  name: "synthetic MQAR (multi-query associative recall), generated fresh every batch"
  source: "generated in run.py (zoology-style: N key-value pairs, then all N keys queried in random order; byte-identical generators to 2026-07-26_mqar-state-capacity / 2026-07-28_mqar-min-selectivity / 2026-07-29_mqar-gate-noise-control / 2026-08-01_mqar-gate-freeze-before-breakout)"
  license: "n/a (synthetic)"
params:
  key_vocab: 64
  val_vocab: 64
  # Arms - byte-identical decay-masked linear-attention code path of 2026-07-28/29/08-01.
  # The LR multiplier is optimizer-side only, so ALL gated arms share the same init key
  # ("dense") and the same data stream: within a seed every glr* run starts byte-identical
  # and any divergence is caused by the gate LR alone (paired comparison, zero init confound
  # - the same design upgrade 2026-08-01 introduced for freeze steps, applied to LR ratio).
  #   none    - vanilla elu+1 (g=1), plateau anchor                          [replication]
  #   glr025 / glr1 / glr4 / glr16 - dense per-channel gate, gate-param LR = mult x base LR
  #   glr1 is an exact replication of 2026-08-01's "dense" arm (same seeds, same inits).
  arms:
    - {name: none,   gate_lr_mult: null, init_key: none,  seeds: [0]}
    - {name: glr025, gate_lr_mult: 0.25, init_key: dense, seeds: [0, 1, 2]}
    - {name: glr1,   gate_lr_mult: 1.0,  init_key: dense, seeds: [0, 1, 2]}
    - {name: glr4,   gate_lr_mult: 4.0,  init_key: dense, seeds: [0, 1, 2]}
    - {name: glr16,  gate_lr_mult: 16.0, init_key: dense, seeds: [0, 1, 2]}
  d_model: 64
  n_layers: 2
  n_heads: 2
  mlp_expansion: 2
  num_pairs_main: 8
  train_steps: 2000
  eval_every: 100        # finer than the parents' 250: escape STEP is the primary metric here
  early_stop_acc: 0.99
  batch_size: 64
  eval_sequences: 512
  eval_chunk: 64
  lr: 0.001
  weight_decay: 0.01
  solve_threshold: 0.9
  escape_threshold: 0.5  # escape step = first eval crossing this (eval grid = 100)
  gate_bias_init: 3.0    # gated arms start at g = sigmoid(3) ~ 0.953 per channel, near-vanilla

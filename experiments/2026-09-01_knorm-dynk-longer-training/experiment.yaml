  name: "tiny-shakespeare (character level)"
  source: "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
  license: "public domain text; char-rnn repo MIT"
  hash: "md5:6fb458f1232090904fb40fe944165e91"
params:
  head_dims: [4, 64]
  arms:
    baseline:    [false, false, null, null]
    qknorm:      [true,  true,  null, null]
    knorm_only:  [false, true,  null, null]
    knorm_dynk:  [false, true,  null, "undetached"]
    k_emascale:  [false, true,  null, "alpha_fixed1"]
  arm_order: ["baseline", "qknorm", "knorm_only", "knorm_dynk", "k_emascale"]

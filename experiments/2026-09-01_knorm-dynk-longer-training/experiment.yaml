# Config for 2026-09-01_knorm-dynk-longer-training. run.py reads it. No magic constants in code.
id: "2026-09-01_knorm-dynk-longer-training"
title: "Does the key-side magnitude channel survive 3x longer training? The four core norm arms at 1800 steps at the cliff and the wide split"
hypothesis: >-
  Every result in the thread is a 600-step early-training snapshot (the 08-30 README names
  'does the hd>=64 k-only win survive longer training?' as the open question). Tonight the
  four core arms (baseline / qknorm / knorm_only / knorm_dynk) train 3x longer (1800 steps,
  same cosine schedule stretched) at hd=4 and hd=64 on 3 paired seeds. Predictions:
  (P1) the hd=4 key-norm cliff shrinks but does not vanish with training (it is a
  parametrisation defect, not a warm-up artefact); (P2) knorm_dynk still beats baseline at
  hd=4; (P3) at hd=64 the k-only family still beats qknorm.
seed: 0

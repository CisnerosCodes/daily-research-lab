# Fill this in. run.py reads it. No magic constants in code.
id: "2026-07-23_superposition-correlation-phase"
title: "Superposition phase diagram: does feature correlation resist or reshape superposition?"
hypothesis: "Raising within-pair activation correlation pushes paired features toward local orthogonality (lower within-pair |cos| than cross-pair) and delays superposition onset, because co-occurring features pay interference cost on every sample."
seed: 0
dataset:
  name: "synthetic sparse features (correlated pairs)"
  source: "generated"
  license: "n/a"
# --- hyperparameters (add whatever the experiment needs) ---
params:
  n_features: 16          # features come in 8 pairs
  m_hidden: 4             # bottleneck dims (4x compression)
  densities: [0.02, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.9]   # P(feature active)
  correlations: [0.0, 0.25, 0.5, 0.75, 1.0]               # within-pair indicator correlation
  seeds: [0, 1]
  steps: 3000
  batch: 1024
  lr: 0.01
  represented_norm_threshold: 0.5

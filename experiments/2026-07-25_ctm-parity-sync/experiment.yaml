id: "2026-07-25_ctm-parity-sync"
title: "Nano Continuous Thought Machine on parity: is the synchronization readout the signal, or just recurrence depth?"
hypothesis: "At matched parameters, matched internal ticks and matched optimizer steps, replacing the CTM's neuron-synchronization readout with a plain last-tick hidden-state readout will cost little or nothing on parity, i.e. the work is done by recurrence depth (plus the neuron-level models), not by pairwise neuron-timing synchronization."
seed: 0
dataset:
  name: "synthetic L-bit parity; x in {-1,+1}^L presented all at once, target = cumulative parity at every index (headline = parity of the whole string)"
  source: "generated in run.py (numpy PCG64); fresh train batches every step, fixed held-out eval set from eval_seed"
  license: "n/a (synthetic)"
# --- hyperparameters ---
params:
  # ---- ablation ladder ----
  arms: ["ctm_sync", "ctm_lastz", "gru_lastz", "gru_sync"]
  lengths: [16, 32]
  seeds: [0, 1]
  ticks: 12                 # internal ticks T, identical for every arm
  # ---- nano CTM sizing (target ~0.05M params) ----
  ctm_neurons: 96           # D: number of neurons; also the number of sync pairs
  ctm_synapse_hidden: 192   # synapse MLP hidden width
  ctm_memory: 6             # M: pre-activation history length per neuron
  ctm_nlm_hidden: 8         # hidden width of each per-neuron MLP
  # GRU hidden width is solved automatically to match the CTM param count
  # ---- optimization (identical for every arm) ----
  steps: 900
  batch_size: 96
  lr: 0.003
  warmup: 100
  weight_decay: 0.01
  # ---- evaluation ----
  eval_n: 1024
  eval_seed: 999
  # ---- depth control: same arms at T=2 internal ticks ----
  ticks_shallow: 2
  depth_control_arms: ["ctm_sync", "ctm_lastz"]
  depth_control_length: 16
  depth_control_reserve_s: 60
  # ---- mechanism control: pairwise products of the CURRENT tick only ----
  # (keeps the sync readout's quadratic feature expansion, removes cross-tick timing)
  mech_control_arms: ["ctm_syncnow"]
  mech_control_length: 16
  mech_control_reserve_s: 40
  # ---- time boxing (CPU, 1 thread, shared 2-core box) ----
  time_cap_s_per_run: 120
  total_time_budget_s: 780
